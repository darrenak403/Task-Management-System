services:
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tms_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-task_management}
    volumes:
      - backend-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: [backend]

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the private db service}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-no}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: api
      args:
        APP_BUILD_SHA: ${APP_BUILD_SHA:-local}
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the private db service}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      AI_ENABLED: ${AI_ENABLED:-true}
      CREDENTIAL_ENCRYPTION_ACTIVE_KEY_VERSION: ${CREDENTIAL_ENCRYPTION_ACTIVE_KEY_VERSION:-v1}
      CREDENTIAL_ENCRYPTION_KEYRING: ${CREDENTIAL_ENCRYPTION_KEYRING:-}
      AI_MAX_INPUT_TOKENS: ${AI_MAX_INPUT_TOKENS:-20000}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-8000}
      AI_PROVIDER_TIMEOUT_MS: ${AI_PROVIDER_TIMEOUT_MS:-60000}
      AI_JOB_TIMEOUT_MS: ${AI_JOB_TIMEOUT_MS:-180000}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 8
      start_period: 15s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [backend, egress]

volumes:
  backend-postgres-data:

networks:
  backend:
    internal: true
  egress:
    driver: bridge
